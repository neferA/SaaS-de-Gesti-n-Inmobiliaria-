version: '3.8'

services:
  # Servicio de Base de Datos
  db:
    image: postgres:15
    container_name: postgres_db_medical
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: medical_web
    volumes:
      
      - type: volume
        source: pg_data_medical_v3
        target: /var/lib/postgresql/data

  # Servicio de Interfaz Gráfica 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_medical
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  pg_data_medical_v3: